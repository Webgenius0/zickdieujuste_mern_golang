definitions:
  gotickets_internal_domain_content_dto.ContentDetail:
    properties:
      audiences:
        items:
          type: string
        type: array
      author_or_speaker:
        type: string
      body_text:
        type: string
      category_tag:
        type: string
      duration_seconds:
        type: integer
      id:
        type: string
      is_premium:
        type: boolean
      media_type:
        type: string
      media_url:
        description: nil if premium-gated
        type: string
      published_at:
        type: string
      related:
        items:
          $ref: '#/definitions/gotickets_internal_domain_content_dto.ContentSummary'
        type: array
      sub_type:
        type: string
      thumbnail_url:
        type: string
      title:
        type: string
      type:
        type: string
    type: object
  gotickets_internal_domain_content_dto.ContentListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/gotickets_internal_domain_content_dto.ContentSummary'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  gotickets_internal_domain_content_dto.ContentSummary:
    properties:
      audiences:
        items:
          type: string
        type: array
      author_or_speaker:
        type: string
      category_tag:
        type: string
      duration_seconds:
        type: integer
      id:
        type: string
      is_premium:
        type: boolean
      media_type:
        type: string
      published_at:
        type: string
      sub_type:
        type: string
      thumbnail_url:
        type: string
      title:
        type: string
      type:
        type: string
    type: object
  gotickets_internal_domain_content_dto.PremiumGateResponse:
    properties:
      code:
        type: integer
      message:
        type: string
      upgrade_url:
        type: string
    type: object
  gotickets_internal_domain_schedule_dto.ScheduleResponse:
    properties:
      id:
        type: string
      morning_prayer_time:
        type: string
      night_prayer_time:
        type: string
      push_enabled:
        type: boolean
      timezone:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  gotickets_internal_domain_schedule_dto.UpdateScheduleRequest:
    properties:
      morning_prayer_time:
        description: '"HH:MM" or "HH:MM:SS"'
        type: string
      night_prayer_time:
        description: '"HH:MM" or "HH:MM:SS"'
        type: string
      push_enabled:
        type: boolean
      timezone:
        description: IANA tz, validated via time.LoadLocation
        type: string
    required:
    - morning_prayer_time
    - night_prayer_time
    - push_enabled
    - timezone
    type: object
  gotickets_internal_domain_subscription_dto.MessageResponse:
    properties:
      message:
        type: string
    type: object
  gotickets_internal_domain_subscription_dto.PlanResponse:
    properties:
      billing_interval:
        type: string
      code:
        type: string
      currency:
        type: string
      id:
        type: string
      name:
        type: string
      price_amount:
        type: number
    type: object
  gotickets_internal_domain_subscription_dto.SubscriptionResponse:
    properties:
      expires_at:
        type: string
      external_transaction_id:
        type: string
      id:
        type: string
      plan:
        $ref: '#/definitions/gotickets_internal_domain_subscription_dto.PlanResponse'
      start_date:
        type: string
      status:
        type: string
      store:
        type: string
      user_id:
        type: string
    type: object
  gotickets_internal_domain_subscription_dto.VerifyReceiptRequest:
    properties:
      receipt_payload:
        description: Raw receipt string / token from the store
        type: string
      store:
        enum:
        - APPLE
        - GOOGLE
        type: string
    required:
    - receipt_payload
    - store
    type: object
  gotickets_internal_domain_subscription_dto.WebhookRequest:
    properties:
      payload:
        additionalProperties: true
        type: object
      store:
        type: string
    type: object
  gotickets_internal_domain_user_dto.AuthResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
    type: object
  gotickets_internal_domain_user_dto.AvatarResponse:
    properties:
      avatar_url:
        type: string
    type: object
  gotickets_internal_domain_user_dto.ChangePasswordRequest:
    properties:
      confirm_password:
        type: string
      new_password:
        minLength: 8
        type: string
      old_password:
        type: string
    required:
    - confirm_password
    - new_password
    - old_password
    type: object
  gotickets_internal_domain_user_dto.ForgotPasswordRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  gotickets_internal_domain_user_dto.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  gotickets_internal_domain_user_dto.MessageResponse:
    properties:
      message:
        type: string
    type: object
  gotickets_internal_domain_user_dto.ProfileResponse:
    properties:
      auth_provider:
        type: string
      avatar_url:
        type: string
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      is_premium:
        type: boolean
      language_preference:
        type: string
      location:
        type: string
      name:
        type: string
      terms_accepted_at:
        type: string
      theme_preference:
        type: string
    type: object
  gotickets_internal_domain_user_dto.RefreshRequest:
    properties:
      refresh_token:
        type: string
    type: object
  gotickets_internal_domain_user_dto.RegisterDeviceRequest:
    properties:
      platform:
        enum:
        - IOS
        - ANDROID
        type: string
      token:
        type: string
    required:
    - platform
    - token
    type: object
  gotickets_internal_domain_user_dto.RegisterRequest:
    properties:
      email:
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - name
    - password
    type: object
  gotickets_internal_domain_user_dto.ResetPasswordRequest:
    properties:
      email:
        type: string
      new_password:
        minLength: 8
        type: string
      otp:
        type: string
    required:
    - email
    - new_password
    - otp
    type: object
  gotickets_internal_domain_user_dto.UpdateProfileRequest:
    properties:
      language_preference:
        type: string
      location:
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
      theme_preference:
        enum:
        - IVORY
        - NAVY
        type: string
    type: object
  gotickets_internal_httpresponse.Error:
    properties:
      code:
        type: integer
      details:
        type: string
      message:
        type: string
    type: object
  internal_server.HealthResponse:
    properties:
      database:
        type: string
      status:
        type: string
      timestamp:
        type: string
    type: object
  internal_server.WelcomeResponse:
    properties:
      docs_url:
        type: string
      environment:
        type: string
      message:
        type: string
      status:
        type: string
      version:
        type: string
    type: object
info:
  contact: {}
paths:
  /:
    get:
      description: Root endpoint to verify the API is running.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_server.WelcomeResponse'
      summary: Welcome to GoTickets API
      tags:
      - System
  /api/v1/auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Sends a 5-digit OTP to the email (10-min expiry). Always returns
        200 to prevent user enumeration.
      parameters:
      - description: Email address
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/gotickets_internal_domain_user_dto.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gotickets_internal_domain_user_dto.MessageResponse'
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/gotickets_internal_httpresponse.Error'
      summary: Request password reset OTP
      tags:
      - Auth
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates an EMAIL user. Returns access + refresh JWT pair.
      parameters:
      - description: Login payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/gotickets_internal_domain_user_dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gotickets_internal_domain_user_dto.AuthResponse'
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/gotickets_internal_httpresponse.Error'
        "401":
          description: Invalid credentials
          schema:
            $ref: '#/definitions/gotickets_internal_httpresponse.Error'
      summary: Login
      tags:
      - Auth
  /api/v1/auth/logout:
    post:
      consumes:
      - application/json
      description: Revokes the current refresh token, ending the session.
      parameters:
      - description: Refresh token (omit if using cookie)
        in: body
        name: request
        schema:
          $ref: '#/definitions/gotickets_internal_domain_user_dto.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gotickets_internal_domain_user_dto.MessageResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/gotickets_internal_httpresponse.Error'
      security:
      - BearerAuth: []
      summary: Logout
      tags:
      - Auth
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: 'Rotates the refresh token: revokes the old one and issues a new
        access + refresh pair. Token may be sent in body or "refresh_token" cookie.'
      parameters:
      - description: Refresh token (omit if using cookie)
        in: body
        name: request
        schema:
          $ref: '#/definitions/gotickets_internal_domain_user_dto.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gotickets_internal_domain_user_dto.AuthResponse'
        "401":
          description: Invalid or expired refresh token
          schema:
            $ref: '#/definitions/gotickets_internal_httpresponse.Error'
      summary: Refresh access token
      tags:
      - Auth
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Creates a new EMAIL-provider account. Returns access + refresh
        JWT pair. Duplicate email returns 409.
      parameters:
      - description: Registration payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/gotickets_internal_domain_user_dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/gotickets_internal_domain_user_dto.AuthResponse'
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/gotickets_internal_httpresponse.Error'
        "409":
          description: Email already registered
          schema:
            $ref: '#/definitions/gotickets_internal_httpresponse.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/gotickets_internal_httpresponse.Error'
      summary: Register a new user
      tags:
      - Auth
  /api/v1/auth/reset-password:
    post:
      consumes:
      - application/json
      description: Verifies the 5-digit OTP and updates the user password.
      parameters:
      - description: Email + OTP + new password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/gotickets_internal_domain_user_dto.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gotickets_internal_domain_user_dto.MessageResponse'
        "400":
          description: Invalid or expired OTP
          schema:
            $ref: '#/definitions/gotickets_internal_httpresponse.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/gotickets_internal_httpresponse.Error'
      summary: Reset password with OTP
      tags:
      - Auth
  /api/v1/content:
    get:
      description: Returns a paginated, filterable list of content items. Supports
        `type`, `sub_type`, `audience`, `category_tag`, and `q` (full-text search)
        query parameters.
      parameters:
      - description: Content type (PRAYER, MOTIVATION, WORSHIP, PROVERB, DAILY_QUOTE,
          ILLUSTRATION, ENCOURAGEMENT)
        in: query
        name: type
        type: string
      - description: Sub-type (e.g. Morning, Night)
        in: query
        name: sub_type
        type: string
      - description: Audience (ALL, KIDS, TEENS)
        in: query
        name: audience
        type: string
      - description: Category tag (e.g. Thanksgiving, Intercession)
        in: query
        name: category_tag
        type: string
      - description: Full-text search query
        in: query
        name: q
        type: string
      - description: 'Page number (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Items per page (default: 20, max: 100)'
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gotickets_internal_domain_content_dto.ContentListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/gotickets_internal_httpresponse.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/gotickets_internal_httpresponse.Error'
      security:
      - BearerAuth: []
      summary: List content
      tags:
      - Content
  /api/v1/content/{id}:
    get:
      description: Returns full detail for a content item. If the content is premium
        and the user is not premium, returns HTTP 403 with an upgrade prompt.
      parameters:
      - description: Content UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gotickets_internal_domain_content_dto.ContentDetail'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/gotickets_internal_httpresponse.Error'
        "403":
          description: Premium content — upgrade required
          schema:
            $ref: '#/definitions/gotickets_internal_domain_content_dto.PremiumGateResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/gotickets_internal_httpresponse.Error'
      security:
      - BearerAuth: []
      summary: Get content detail
      tags:
      - Content
  /api/v1/content/{id}/related:
    get:
      description: Returns a list of content items related to the given content ID
        via the related_content join table.
      parameters:
      - description: Content UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/gotickets_internal_domain_content_dto.ContentSummary'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/gotickets_internal_httpresponse.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/gotickets_internal_httpresponse.Error'
      security:
      - BearerAuth: []
      summary: Get related content
      tags:
      - Content
  /api/v1/content/daily-quote:
    get:
      description: Returns the DAILY_QUOTE content item for the current date, filtered
        by published_at.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gotickets_internal_domain_content_dto.ContentDetail'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/gotickets_internal_httpresponse.Error'
        "404":
          description: No quote for today
          schema:
            $ref: '#/definitions/gotickets_internal_httpresponse.Error'
      security:
      - BearerAuth: []
      summary: Get today's daily quote
      tags:
      - Content
  /api/v1/devices:
    post:
      consumes:
      - application/json
      description: Registers or refreshes an FCM (Android) or APNs (iOS) push notification
        token. Upserts on (user_id, token).
      parameters:
      - description: Device token payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/gotickets_internal_domain_user_dto.RegisterDeviceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gotickets_internal_domain_user_dto.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/gotickets_internal_httpresponse.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/gotickets_internal_httpresponse.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/gotickets_internal_httpresponse.Error'
      security:
      - BearerAuth: []
      summary: Register device token
      tags:
      - Devices
  /api/v1/schedules/me:
    get:
      description: Returns the authenticated user's prayer schedule. Creates a default
        schedule on first access (05:00 morning, 21:00 night, UTC, push enabled) rather
        than returning 404.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gotickets_internal_domain_schedule_dto.ScheduleResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/gotickets_internal_httpresponse.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/gotickets_internal_httpresponse.Error'
      security:
      - BearerAuth: []
      summary: Get current user's prayer schedule
      tags:
      - Schedule
    put:
      consumes:
      - application/json
      description: Updates morning_prayer_time, night_prayer_time, timezone (must
        be valid IANA string), and push_enabled for the authenticated user.
      parameters:
      - description: Schedule update payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/gotickets_internal_domain_schedule_dto.UpdateScheduleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gotickets_internal_domain_schedule_dto.ScheduleResponse'
        "400":
          description: Validation error or invalid timezone
          schema:
            $ref: '#/definitions/gotickets_internal_httpresponse.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/gotickets_internal_httpresponse.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/gotickets_internal_httpresponse.Error'
      security:
      - BearerAuth: []
      summary: Update prayer schedule
      tags:
      - Schedule
  /api/v1/subscriptions/plans:
    get:
      description: Returns all active subscription plans (Biannual, Annual, Friends
        & Family).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/gotickets_internal_domain_subscription_dto.PlanResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/gotickets_internal_httpresponse.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/gotickets_internal_httpresponse.Error'
      security:
      - BearerAuth: []
      summary: List subscription plans
      tags:
      - Subscriptions
  /api/v1/subscriptions/verify:
    post:
      consumes:
      - application/json
      description: Verifies an Apple or Google Play receipt, upserts a subscription
        record, and marks the user as premium. Receipt validation is currently stubbed
        — real integration pending.
      parameters:
      - description: Store and receipt payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/gotickets_internal_domain_subscription_dto.VerifyReceiptRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gotickets_internal_domain_subscription_dto.SubscriptionResponse'
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/gotickets_internal_httpresponse.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/gotickets_internal_httpresponse.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/gotickets_internal_httpresponse.Error'
      security:
      - BearerAuth: []
      summary: Verify purchase receipt
      tags:
      - Subscriptions
  /api/v1/subscriptions/webhook:
    post:
      consumes:
      - application/json
      description: Receives renewal, cancellation, and refund events from Apple and
        Google. No auth middleware — store signature verification is applied instead
        (currently stubbed with a TODO).
      parameters:
      - description: Webhook payload from Apple or Google
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/gotickets_internal_domain_subscription_dto.WebhookRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gotickets_internal_domain_subscription_dto.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/gotickets_internal_httpresponse.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/gotickets_internal_httpresponse.Error'
      summary: Handle store webhook
      tags:
      - Subscriptions
  /api/v1/users/me:
    delete:
      description: Soft-deletes the authenticated user's account (sets deleted_at).
        No hard purge occurs synchronously.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gotickets_internal_domain_user_dto.MessageResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/gotickets_internal_httpresponse.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/gotickets_internal_httpresponse.Error'
      security:
      - BearerAuth: []
      summary: Delete account
      tags:
      - Users
    get:
      description: Returns the full profile and settings for the authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gotickets_internal_domain_user_dto.ProfileResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/gotickets_internal_httpresponse.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/gotickets_internal_httpresponse.Error'
      security:
      - BearerAuth: []
      summary: Get current user profile
      tags:
      - Users
    put:
      consumes:
      - application/json
      description: Updates name, location, theme preference, or language preference.
      parameters:
      - description: Fields to update (all optional)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/gotickets_internal_domain_user_dto.UpdateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gotickets_internal_domain_user_dto.ProfileResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/gotickets_internal_httpresponse.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/gotickets_internal_httpresponse.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/gotickets_internal_httpresponse.Error'
      security:
      - BearerAuth: []
      summary: Update profile
