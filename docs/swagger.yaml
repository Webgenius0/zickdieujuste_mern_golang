  /api/v1/upload:
    delete:
      consumes:
      - application/json
      description: |-
        Permanently removes a file from Cloudinary using its public_id.
        The public_id is returned by POST /api/v1/upload.
      parameters:
      - description: Full Cloudinary URL to delete
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_domain_media.DeleteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_domain_media.DeleteResponse'
        "400":
          description: Missing public_id
          schema:
            $ref: '#/definitions/gotickets_internal_httpresponse.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/gotickets_internal_httpresponse.Error'
        "503":
          description: Upload service unavailable
          schema:
            $ref: '#/definitions/gotickets_internal_httpresponse.Error'
      security:
      - BearerAuth: []
      summary: Delete an uploaded file
      tags:
      - Media
    post:
      consumes:
      - multipart/form-data
      description: |-
        Uploads any file (image, audio, etc.) to Cloudinary and returns the public URL.
        Pass an optional `folder` query parameter to organise assets (e.g. `?folder=content/thumbnails`).
        The returned `url` can be stored and referenced by any domain (content, profile, etc.).
      parameters:
      - description: File to upload
        in: formData
        name: file
        required: true
        type: file
      - description: 'Cloudinary folder (default: zick/uploads)'
        in: query
        name: folder
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_domain_media.UploadResponse'
        "400":
          description: Missing or oversized file
          schema:
            $ref: '#/definitions/gotickets_internal_httpresponse.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/gotickets_internal_httpresponse.Error'
        "503":
          description: Upload service unavailable
          schema:
            $ref: '#/definitions/gotickets_internal_httpresponse.Error'
      security:
      - BearerAuth: []
      summary: Upload a file
      tags:
      - Media
