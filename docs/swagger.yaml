      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/gotickets_internal_httpresponse.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/gotickets_internal_httpresponse.Error'
